
name: Windows Temporary VPS - Verified

on:
  workflow_dispatch:

jobs:
  windows-vps:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. WINDOWS RUNNER
      # ============================================================
      - name: 01 - Verify Windows Runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "WINDOWS RUNNER"
          Write-Host "=========================================="

          Write-Host "ComputerName:"
          $env:COMPUTERNAME

          Write-Host ""
          Write-Host "OS:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion

      # ============================================================
      # 2. ENABLE / PREPARE WSL
      # ============================================================
      - name: 02 - Prepare WSL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "PREPARING WSL"
          Write-Host "=========================================="

          wsl.exe --status

          Write-Host ""
          Write-Host "WSL version:"
          wsl.exe --version

      - name: "3. Install and Verify Ubuntu 24.04"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INSTALLING UBUNTU 24.04"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Current WSL state:"
          wsl.exe --list --verbose

          Write-Host ""
          Write-Host "Checking Ubuntu-24.04 directly..."

          $ubuntuTest = wsl.exe -d Ubuntu-24.04 -- bash -lc "echo UBUNTU_LAUNCH_OK" 2>&1 | Out-String

          Write-Host $ubuntuTest

          if ($ubuntuTest -match "UBUNTU_LAUNCH_OK") {
              Write-Host ""
              Write-Host "Ubuntu-24.04 is already installed and executable."
          }
          else {

              Write-Host ""
              Write-Host "Ubuntu-24.04 is not usable. Installing..."

              wsl.exe --install -d Ubuntu-24.04 --no-launch

              if ($LASTEXITCODE -ne 0) {
                  throw "Ubuntu installation command failed."
              }

              Write-Host ""
              Write-Host "Installation command completed."

              Write-Host ""
              Write-Host "Waiting for Ubuntu to become launchable..."

              $ubuntuReady = $false

              for ($i = 1; $i -le 60; $i++) {

                  Write-Host "Launch test $i/60..."

                  $test = wsl.exe -d Ubuntu-24.04 -- bash -lc "echo UBUNTU_LAUNCH_OK" 2>&1 | Out-String

                  Write-Host $test

                  if ($test -match "UBUNTU_LAUNCH_OK") {
                      $ubuntuReady = $true
                      break
                  }

                  Start-Sleep -Seconds 2
              }

              if (-not $ubuntuReady) {

                  Write-Host ""
                  Write-Host "=========================================="
                  Write-Host "FINAL WSL STATE"
                  Write-Host "=========================================="

                  wsl.exe --list --verbose

                  throw "Ubuntu-24.04 was installed but could not be launched."
              }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFYING UBUNTU ENVIRONMENT"
          Write-Host "=========================================="

          wsl.exe -d Ubuntu-24.04 -- bash -lc "echo 'Distribution: Ubuntu-24.04'; cat /etc/os-release; echo 'Kernel:'; uname -a; echo 'Architecture:'; uname -m"

          if ($LASTEXITCODE -ne 0) {
              throw "Ubuntu environment verification failed."
          }

          Write-Host ""
          Write-Host "Final WSL state:"
          wsl.exe --list --verbose

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "UBUNTU 24.04 VERIFIED SUCCESSFULLY"
          Write-Host "=========================================="
          
      # ============================================================
      # 4. INITIALIZE UBUNTU
      # ============================================================

      - name: "4. Initialize Ubuntu"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INITIALIZING UBUNTU"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Launching Ubuntu-24.04..."

          $result = wsl.exe -d Ubuntu-24.04 -- bash -lc "echo WSL_INIT_OK" 2>&1 | Out-String

          Write-Host $result

          if ($LASTEXITCODE -ne 0) {
              throw "Ubuntu-24.04 launch failed."
          }

          if ($result -notmatch "WSL_INIT_OK") {
              throw "Ubuntu-24.04 did not return the expected initialization response."
          }

          Write-Host ""
          Write-Host "Ubuntu shell execution verified."

          Write-Host ""
          Write-Host "Checking Ubuntu identity..."

          $idResult = wsl.exe -d Ubuntu-24.04 -- bash -lc "grep '^ID=' /etc/os-release" 2>&1 | Out-String

          Write-Host $idResult

          if ($LASTEXITCODE -ne 0) {
              throw "Ubuntu ID check failed."
          }

          if ($idResult -notmatch "ID=ubuntu") {
              throw "The WSL distribution is not Ubuntu."
          }

          $versionResult = wsl.exe -d Ubuntu-24.04 -- bash -lc "grep '^VERSION_ID=' /etc/os-release" 2>&1 | Out-String

          Write-Host $versionResult

          if ($LASTEXITCODE -ne 0) {
              throw "Ubuntu version check failed."
          }

          if ($versionResult -notmatch 'VERSION_ID="24\.04"') {
              throw "Ubuntu version is not 24.04."
          }

          $codenameResult = wsl.exe -d Ubuntu-24.04 -- bash -lc "grep '^VERSION_CODENAME=' /etc/os-release" 2>&1 | Out-String

          Write-Host $codenameResult

          if ($LASTEXITCODE -ne 0) {
              throw "Ubuntu codename check failed."
          }

          if ($codenameResult -notmatch "VERSION_CODENAME=noble") {
              throw "Ubuntu codename is not noble."
          }

          Write-Host ""
          Write-Host "Ubuntu 24.04 identity verified."

          Write-Host ""
          Write-Host "Testing package manager..."

          $aptResult = wsl.exe -d Ubuntu-24.04 -- bash -lc "command -v apt && apt --version" 2>&1 | Out-String

          Write-Host $aptResult

          if ($LASTEXITCODE -ne 0) {
              throw "APT is not available."
          }

          if ($aptResult -notmatch "apt") {
              throw "APT verification failed."
          }

          Write-Host ""
          Write-Host "APT verified."

          Write-Host ""
          Write-Host "WSL distributions:"
          wsl.exe --list --verbose

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "UBUNTU 24.04 INITIALIZATION VERIFIED"
          Write-Host "=========================================="

      # ============================================================
      # 5. VERIFY UBUNTU
      # ============================================================
      - name: 05 - Verify Ubuntu
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING UBUNTU"
          Write-Host "=========================================="

          wsl.exe -d Ubuntu-24.04 -- bash -lc "cat /etc/os-release"

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to execute commands inside Ubuntu."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "grep -q 'Ubuntu 24.04' /etc/os-release"

          if ($LASTEXITCODE -ne 0) {
              throw "Ubuntu 24.04 verification failed."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "uname -a"

          Write-Host ""
          Write-Host "Ubuntu 24.04 VERIFIED."

      # ============================================================
      # 6. INSTALL DOCKER
      # ============================================================
      - name: 06 - Install Docker Engine
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INSTALLING DOCKER ENGINE"
          Write-Host "=========================================="

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo apt-get update"

          if ($LASTEXITCODE -ne 0) {
              throw "apt update failed."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo apt-get install -y ca-certificates curl"

          if ($LASTEXITCODE -ne 0) {
              throw "Required packages installation failed."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo install -m 0755 -d /etc/apt/keyrings"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc"

          if ($LASTEXITCODE -ne 0) {
              throw "Docker GPG key download failed."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo chmod a+r /etc/apt/keyrings/docker.asc"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo apt-get update"

          if ($LASTEXITCODE -ne 0) {
              throw "Docker repository apt update failed."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"

          if ($LASTEXITCODE -ne 0) {
              throw "Docker installation failed."
          }

      # ============================================================
      # 7. VERIFY DOCKER
      # ============================================================
      - name: 07 - Verify Docker
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING DOCKER"
          Write-Host "=========================================="

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker --version"

          if ($LASTEXITCODE -ne 0) {
              throw "Docker CLI is not working."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker compose version"

          if ($LASTEXITCODE -ne 0) {
              throw "Docker Compose is not working."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker info --format 'Server={{.ServerVersion}} Containers={{.Containers}} Images={{.Images}}'"

          if ($LASTEXITCODE -ne 0) {
              throw "Docker daemon is not reachable."
          }

          Write-Host ""
          Write-Host "Running Docker hello-world..."

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker run --rm hello-world"

          if ($LASTEXITCODE -ne 0) {
              throw "Docker hello-world test failed."
          }

          Write-Host ""
          Write-Host "DOCKER VERIFIED."

      # ============================================================
      # 8. PREPARE YOUTRACK STORAGE
      # ============================================================
      - name: 08 - Prepare YouTrack Storage
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "PREPARING YOUTRACK STORAGE"
          Write-Host "=========================================="

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo mkdir -p /opt/youtrack/data /opt/youtrack/conf /opt/youtrack/logs /opt/youtrack/backups"

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create YouTrack directories."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo chown -R 13001:13001 /opt/youtrack"

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to set YouTrack ownership."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo chmod -R u+rwX /opt/youtrack"

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to set YouTrack permissions."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo ls -ld /opt/youtrack /opt/youtrack/data /opt/youtrack/conf /opt/youtrack/logs /opt/youtrack/backups"

      # ============================================================
      # 9. PULL YOUTRACK
      # ============================================================
      - name: 09 - Pull YouTrack Image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "jetbrains/youtrack:2026.2.18991"

          Write-Host "=========================================="
          Write-Host "PULLING YOUTRACK IMAGE"
          Write-Host "=========================================="

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker pull $image"

          if ($LASTEXITCODE -ne 0) {
              throw "YouTrack image pull failed."
          }

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker image inspect $image > /dev/null"

          if ($LASTEXITCODE -ne 0) {
              throw "YouTrack image verification failed."
          }

          Write-Host ""
          Write-Host "YOUTRACK IMAGE VERIFIED."

      # ============================================================
      # 10. START YOUTRACK
      # ============================================================
      - name: 10 - Start YouTrack
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "STARTING YOUTRACK"
          Write-Host "=========================================="

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker rm -f youtrack 2>/dev/null || true"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker run -d --name youtrack --restart unless-stopped -v /opt/youtrack/data:/opt/youtrack/data -v /opt/youtrack/conf:/opt/youtrack/conf -v /opt/youtrack/logs:/opt/youtrack/logs -v /opt/youtrack/backups:/opt/youtrack/backups -p 8080:8080 jetbrains/youtrack:2026.2.18991"

          if ($LASTEXITCODE -ne 0) {
              throw "YouTrack container failed to start."
          }

          Start-Sleep -Seconds 10

          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker inspect -f '{{.State.Status}}' youtrack"

          if ($LASTEXITCODE -ne 0) {
              throw "YouTrack container inspection failed."
          }

      # ============================================================
      # 11. WAIT FOR YOUTRACK APPLICATION
      # ============================================================
      - name: 11 - Wait for YouTrack HTTP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "WAITING FOR YOUTRACK APPLICATION"
          Write-Host "=========================================="

          $ready = $false

          for ($i = 1; $i -le 60; $i++) {

              Write-Host "Health check $i/60..."

              $http = wsl.exe -d Ubuntu-24.04 -- bash -lc "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/hub/auth/login"

              $http = ($http | Out-String).Trim()

              Write-Host "HTTP=$http"

              if ($http -match "^(200|301|302|303|307|308)$") {
                  $ready = $true
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $ready) {
              Write-Host ""
              Write-Host "YouTrack did not become ready."
              Write-Host ""
              Write-Host "Container status:"
              wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker ps -a --filter name=youtrack"

              Write-Host ""
              Write-Host "Last YouTrack logs:"
              wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker logs --tail 100 youtrack"

              throw "YouTrack HTTP health check failed."
          }

          Write-Host ""
          Write-Host "YOUTRACK HTTP HEALTH CHECK PASSED."

      # ============================================================
      # 12. VERIFY YOUTRACK CONTAINER + HTTP
      # ============================================================
      - name: 12 - Verify YouTrack
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "FINAL YOUTRACK VERIFICATION"
          Write-Host "=========================================="

          $status = wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker inspect -f '{{.State.Status}}' youtrack"

          $status = ($status | Out-String).Trim()

          Write-Host "Container status: $status"

          if ($status -ne "running") {
              throw "YouTrack container is not running."
          }

          $http = wsl.exe -d Ubuntu-24.04 -- bash -lc "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/hub/auth/login"

          $http = ($http | Out-String).Trim()

          Write-Host "YouTrack HTTP: $http"

          if ($http -notmatch "^(200|301|302|303|307|308)$") {
              throw "YouTrack HTTP verification failed. HTTP=$http"
          }

          Write-Host ""
          Write-Host "YouTrack container:"
          wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker ps --filter name=youtrack --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'"

          Write-Host ""
          Write-Host "YOUTRACK VERIFIED."

      # ============================================================
      # 13. CONFIGURE WINDOWS RDP
      # ============================================================
      - name: 13 - Configure Windows RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CONFIGURING RDP"
          Write-Host "=========================================="

          $username = "NvDAdmin"
          $password = "P@ssw0rd1qazXSW@#"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "Temporary GitHub Runner RDP User"

          }
          else {

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Restart-Service TermService -Force

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "RDP configured."

      # ============================================================
      # 14. VERIFY RDP
      # ============================================================
      - name: 14 - Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING RDP"
          Write-Host "=========================================="

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
              throw "RDP TCP 3389 is not listening."
          }

          Write-Host "RDP TCP 3389: OPEN"

          $service = Get-Service TermService

          Write-Host "TermService: $($service.Status)"

          if ($service.Status -ne "Running") {
              throw "Remote Desktop Services is not running."
          }

          Write-Host ""
          Write-Host "RDP VERIFIED."

      # ============================================================
      # 15. INSTALL TAILSCALE
      # ============================================================
      - name: 15 - Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INSTALLING TAILSCALE"
          Write-Host "=========================================="

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {

              $installer = "$env:TEMP\tailscale-setup.exe"

              Invoke-WebRequest `
                -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
                -OutFile $installer

              if (-not (Test-Path $installer)) {
                  throw "Tailscale installer download failed."
              }

              Start-Process `
                -FilePath $installer `
                -ArgumentList "/quiet" `
                -Wait `
                -NoNewWindow

              Start-Sleep -Seconds 5
          }

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale executable was not found."
          }

          & $tailscaleExe version

      # ============================================================
      # 16. CONNECT TAILSCALE
      # ============================================================
      - name: 16 - Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CONNECTING TAILSCALE"
          Write-Host "=========================================="

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY GitHub Secret is missing."
          }

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscaleExe up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server" `
            --unattended=true

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale authentication failed."
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "Tailscale status:"
          & $tailscaleExe status

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          $tailscaleIP = (& $tailscaleExe ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIP)) {
              throw "Tailscale IPv4 address was not obtained."
          }

          Write-Host $tailscaleIP

      # ============================================================
      # 17. END-TO-END TAILSCALE/RDP CHECK
      # ============================================================
      - name: 17 - Verify Tailscale Network
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING TAILSCALE NETWORK"
          Write-Host "=========================================="

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $tailscaleIP = (& $tailscaleExe ip -4).Trim()

          if ($tailscaleIP -notmatch "^100\.") {
              throw "Invalid Tailscale IPv4 address: $tailscaleIP"
          }

          Write-Host "Tailscale IPv4: $tailscaleIP"

          $rdp = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $rdp.TcpTestSucceeded) {
              throw "RDP port 3389 is not available."
          }

          Write-Host "Local RDP port 3389: OPEN"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "CONNECTION INFORMATION"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $tailscaleIP

          Write-Host ""
          Write-Host "RDP:"
          Write-Host "$tailscaleIP`:3389"

          Write-Host ""
          Write-Host "Username:"
          Write-Host "NvDAdmin"
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          
          Write-Host ""
          Write-Host "YouTrack:"
          Write-Host "http://localhost:8080"

          Write-Host ""
          Write-Host "RDP + TAILSCALE VERIFICATION PASSED."

      # ============================================================
      # 18. FINAL SYSTEM VERIFICATION
      # ============================================================

      - name: "18. Final System Verification"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "FINAL SYSTEM VERIFICATION"
          Write-Host "=========================================="

          # --------------------------------------------------
          # WSL
          # --------------------------------------------------

          Write-Host ""
          Write-Host "WSL:"
          wsl.exe --list --verbose

          $ubuntuTest = wsl.exe -d Ubuntu-24.04 -- bash -lc "echo FINAL_WSL_OK" 2>&1 | Out-String

          Write-Host $ubuntuTest

          if ($ubuntuTest -notmatch "FINAL_WSL_OK") {
              throw "Final WSL execution verification failed."
          }

          Write-Host "WSL execution: PASS"

          # --------------------------------------------------
          # DOCKER
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Docker:"

          $dockerInfo = wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker info --format 'Server={{.ServerVersion}} Containers={{.Containers}} Images={{.Images}}'" 2>&1 | Out-String

          Write-Host $dockerInfo

          if ($dockerInfo -notmatch "Server=29\.8\.1") {
              throw "Docker Engine verification failed."
          }

          Write-Host "Docker Engine: PASS"

          # --------------------------------------------------
          # YOUTRACK CONTAINER
          # --------------------------------------------------

          Write-Host ""
          Write-Host "YouTrack:"

          $youtrackStatus = wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker inspect -f 'STATUS={{.State.Status}} HEALTH={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' youtrack" 2>&1 | Out-String

          Write-Host $youtrackStatus

          if ($youtrackStatus -notmatch "STATUS=running") {
              throw "YouTrack container is not running."
          }

          Write-Host "YouTrack container: RUNNING"

          # --------------------------------------------------
          # YOUTRACK PORT
          # --------------------------------------------------

          Write-Host ""
          Write-Host "YouTrack port:"

          $portCheck = wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker port youtrack 8080" 2>&1 | Out-String

          Write-Host $portCheck

          if ($portCheck -notmatch "8080") {
              throw "YouTrack port 8080 is not mapped."
          }

          Write-Host "YouTrack port mapping: PASS"

          # --------------------------------------------------
          # YOUTRACK HTTP READINESS
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Waiting for YouTrack HTTP readiness..."

          $youtrackReady = $false
          $lastHttp = ""

          for ($i = 1; $i -le 60; $i++) {

              $httpResult = wsl.exe -d Ubuntu-24.04 -- bash -lc "curl -s -o /dev/null -w 'HTTP=%{http_code}' http://127.0.0.1:8080/hub/auth/login" 2>&1 | Out-String

              $httpResult = $httpResult.Trim()

              $lastHttp = $httpResult

              Write-Host "HTTP check $i/60 : $httpResult"

              if ($httpResult -match "HTTP=(200|301|302|303|307|308)") {
                  $youtrackReady = $true
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $youtrackReady) {

              Write-Host ""
              Write-Host "Last HTTP result:"
              Write-Host $lastHttp

              Write-Host ""
              Write-Host "YouTrack container logs:"
              wsl.exe -d Ubuntu-24.04 -- bash -lc "sudo docker logs --tail 100 youtrack"

              throw "YouTrack HTTP endpoint did not become ready."
          }

          Write-Host ""
          Write-Host "YouTrack HTTP: READY"

          # --------------------------------------------------
          # RDP
          # --------------------------------------------------

          Write-Host ""
          Write-Host "RDP:"

          $rdp = Test-NetConnection 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue

          if (-not $rdp.TcpTestSucceeded) {
              throw "RDP port 3389 is not reachable."
          }

          Write-Host ""
          Write-Host "RDP port 3389: OPEN"

          # --------------------------------------------------
          # FINAL RESULT
          # --------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ALL FINAL SYSTEM VERIFICATIONS PASSED"
          Write-Host "=========================================="

      # ============================================================
      # 19. KEEP RUNNER ALIVE
      # ============================================================
      - name: 19 - Keep Temporary VPS Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TEMPORARY WINDOWS VPS IS ONLINE"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "This runner is ephemeral."
          Write-Host "It will exist only while this GitHub Actions job remains active."

          while ($true) {

              $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              Write-Host "$timestamp - VPS alive"

              Start-Sleep -Seconds 60
          }
