name: Windows Cloud RDP2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
    
      # ============================================================
      # 1. ENABLE RDP + FIREWALL
      # ============================================================
      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Write-Host "=== Enabling Remote Desktop ===" -ForegroundColor Cyan
    
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0
    
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    
          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1
    
          Write-Host "RDP enabled successfully." -ForegroundColor Green
    
    
      # ============================================================
      # 2. CREATE ADMIN USER
      # ============================================================
      - name: 2. Create Admin Account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "=== Creating NvDAdmin ===" -ForegroundColor Cyan
    
          if (-not $env:RDP_PASSWORD) {
            throw "RDP_PASSWORD secret is not configured."
          }
    
          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force
    
          if (-not (Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue)) {
    
            New-LocalUser `
              -Name "NvDAdmin" `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
    
            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "NvDAdmin"
    
            Write-Host "NvDAdmin created." -ForegroundColor Green
    
          } else {
    
            Write-Host "NvDAdmin already exists." -ForegroundColor Yellow
          }
    
    
      # ============================================================
      # 3. INSTALL TAILSCALE
      # ============================================================
      - name: 3. Install & Connect Tailscale VPN
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "=== Installing Tailscale ===" -ForegroundColor Cyan
    
          $TailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
    
          if (-not (Test-Path $TailscalePath)) {
    
            Invoke-WebRequest `
              "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
              -OutFile "C:\tailscale.msi"
    
            Start-Process `
              msiexec.exe `
              -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
              -Wait
          }
    
          Start-Sleep -Seconds 5
    
          & $TailscalePath up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"
    
          Start-Sleep -Seconds 8
    
          $ts_ip = & $TailscalePath ip -4
    
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> WINDOWS RDP SERVER READY <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Username     : NvDAdmin" -ForegroundColor Yellow
          Write-Host "Password     : Stored in GitHub Secret" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Connect using:"
          Write-Host "mstsc -> $ts_ip" -ForegroundColor Magenta
    
    
      # ============================================================
      # 4. INSTALL DEVELOPMENT TOOLS
      # ============================================================
      - name: 4. Install Git, VS Code, 7-Zip and Utilities
        shell: powershell
        run: |
          Write-Host "=== Installing Development Tools ===" -ForegroundColor Cyan
    
          $packages = @(
            "Git.Git",
            "Microsoft.VisualStudioCode",
            "7zip.7zip",
            "GitHub.cli"
          )
    
          foreach ($package in $packages) {
    
            Write-Host "Installing $package ..." -ForegroundColor Yellow
    
            winget install `
              --id $package `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity
    
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Installation returned code $LASTEXITCODE for $package"
            }
          }
    
          Write-Host "Development tools installation completed." -ForegroundColor Green
    
    
      # ============================================================
      # 5. INSTALL PYTHON
      # ============================================================
      - name: 5. Install Python
        shell: powershell
        run: |
          Write-Host "=== Installing Python ===" -ForegroundColor Cyan
    
          winget install `
            --id Python.Python.3.12 `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
    
          Write-Host "Python installation completed." -ForegroundColor Green
    
    
      # ============================================================
      # 6. INSTALL PERSIAN LANGUAGE / KEYBOARD
      # ============================================================
      - name: 6. Install Persian Keyboard
        shell: powershell
        run: |
          Write-Host "=== Configuring Persian Keyboard ===" -ForegroundColor Cyan
    
          # Install Persian language resources
          if (Get-Command Install-Language -ErrorAction SilentlyContinue) {
    
            try {
              Install-Language fa-IR -CopyToSettings -ErrorAction Stop
              Write-Host "Persian language resources installed." -ForegroundColor Green
            }
            catch {
              Write-Warning "Persian language package installation returned: $($_.Exception.Message)"
            }
          }
    
          # Configure current GitHub runner user
          $LanguageList = New-WinUserLanguageList -Language "en-US"
          $LanguageList.Add("fa-IR")
    
          Set-WinUserLanguageList `
            -LanguageList $LanguageList `
            -Force
    
          Write-Host "Persian keyboard configured for current user." -ForegroundColor Green
    
          # Configure NvDAdmin
          $password = ConvertTo-SecureString `
            "${{ secrets.RDP_PASSWORD }}" `
            -AsPlainText `
            -Force
    
          $credential = New-Object `
            System.Management.Automation.PSCredential(
              "NvDAdmin",
              $password
            )
    
          $script = {
            $List = New-WinUserLanguageList -Language "en-US"
            $List.Add("fa-IR")
    
            Set-WinUserLanguageList `
              -LanguageList $List `
              -Force
    
            Set-WinDefaultInputMethodOverride `
              -InputTip "0429:00000429"
          }
    
          Start-Process `
            powershell.exe `
            -Credential $credential `
            -ArgumentList "-NoProfile -ExecutionPolicy Bypass -Command & { $($script.ToString()) }" `
            -Wait
    
          Write-Host "Persian keyboard configured for NvDAdmin." -ForegroundColor Green
    
    
      # ============================================================
      # 7. INSTALL SQL SERVER
      # ============================================================
      - name: 7. Install SQL Server Developer
        shell: powershell
        run: |
          Write-Host "=== Installing SQL Server ===" -ForegroundColor Cyan
    
          winget install `
            --id Microsoft.SQLServer.2019.Developer `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
    
          Write-Host "SQL Server installation completed." -ForegroundColor Green
    
    
      # ============================================================
      # 8. INSTALL SQL SERVER MANAGEMENT STUDIO
      # ============================================================
      - name: 8. Install SQL Server Management Studio
        shell: powershell
        run: |
          Write-Host "=== Installing SSMS ===" -ForegroundColor Cyan
    
          winget install `
            --id Microsoft.SQLServerManagementStudio `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
    
          Write-Host "SSMS installation completed." -ForegroundColor Green
    
    
      # ============================================================
      # 9. INSTALL DOCKER DESKTOP
      # ============================================================
      - name: 9. Install Docker Desktop
        shell: powershell
        run: |
          Write-Host "=== Installing Docker Desktop ===" -ForegroundColor Cyan
    
          winget install `
            --id Docker.DockerDesktop `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
    
          Write-Host "Docker Desktop installation completed." -ForegroundColor Green
    
    
      # ============================================================
      # 10. ENABLE WSL
      # ============================================================
      - name: 10. Enable WSL
        shell: powershell
        run: |
          Write-Host "=== Enabling WSL ===" -ForegroundColor Cyan
    
          dism.exe /online /enable-feature `
            /featurename:Microsoft-Windows-Subsystem-Linux `
            /all `
            /norestart
    
          dism.exe /online /enable-feature `
            /featurename:VirtualMachinePlatform `
            /all `
            /norestart
    
          Write-Host "WSL features enabled." -ForegroundColor Green
    
    
      # ============================================================
      # 11. INSTALL COMMON CLI TOOLS
      # ============================================================
      - name: 11. Install Useful CLI Tools
        shell: powershell
        run: |
          Write-Host "=== Installing CLI Tools ===" -ForegroundColor Cyan
    
          $packages = @(
            "OpenJS.NodeJS.LTS",
            "Microsoft.PowerShell",
            "Microsoft.AzureCLI"
          )
    
          foreach ($package in $packages) {
    
            Write-Host "Installing $package ..." -ForegroundColor Yellow
    
            winget install `
              --id $package `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity `
              2>$null
    
          }
    
          Write-Host "CLI tools completed." -ForegroundColor Green
    
    
      # ============================================================
      # 12. VERIFY INSTALLATION
      # ============================================================
      - name: 12. Verify Environment
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "           ENVIRONMENT VERIFICATION" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan
    
          Write-Host ""
          Write-Host "--- Git ---" -ForegroundColor Yellow
          git --version
    
          Write-Host ""
          Write-Host "--- Python ---" -ForegroundColor Yellow
          python --version
    
          Write-Host ""
          Write-Host "--- Node ---" -ForegroundColor Yellow
          node --version
    
          Write-Host ""
          Write-Host "--- Docker ---" -ForegroundColor Yellow
          docker --version
    
          Write-Host ""
          Write-Host "--- Tailscale ---" -ForegroundColor Yellow
          & "C:\Program Files\Tailscale\tailscale.exe" version
    
          Write-Host ""
          Write-Host "--- SQL Server Services ---" -ForegroundColor Yellow
          Get-Service | Where-Object {
            $_.Name -like "*MSSQL*"
          } | Select-Object Name, Status, StartType
    
          Write-Host ""
          Write-Host "--- Persian Keyboard ---" -ForegroundColor Yellow
          Get-WinUserLanguageList | Select-Object LanguageTag, InputMethodTips
    
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "           VPS INITIALIZATION COMPLETE" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
    
    
      # ============================================================
      # 13. KEEP SERVER ALIVE
      # ============================================================
      - name: 13. Keep Server Alive
        shell: powershell
        run: |
          Write-Host "=== Server is ready ===" -ForegroundColor Green
    
          for ($i = 1; $i -le 2880; $i++) {
    
            Start-Sleep -Seconds 60
    
            if (($i % 5) -eq 0) {
              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
    
              Write-Host "[$time] Server running... $i/2880 minutes"
            }
          }
