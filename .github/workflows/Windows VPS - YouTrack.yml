# ============================================================
# YouTrack on Windows GitHub VPS
# Architecture:
# Windows -> WSL2 Ubuntu -> Docker Engine -> YouTrack
# ============================================================

name: Windows VPS - YouTrack

on:
  workflow_dispatch:

jobs:
  youtrack:
    runs-on: windows-latest

    steps:

      # ==========================================================
      # 1. Prepare WSL
      # ==========================================================
      - name: 1. Prepare WSL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Preparing Windows WSL"
          Write-Host "=========================================="

          wsl --status

          Write-Host ""
          Write-Host "Setting WSL2 as default..."

          wsl --set-default-version 2

          Write-Host ""
          Write-Host "WSL status:"
          wsl --status

      # ==========================================================
      # 2. Install Ubuntu 24.04 on WSL2
      # ==========================================================
      - name: 2. Install Ubuntu 24.04
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing Ubuntu 24.04 on WSL2"
          Write-Host "=========================================="

          # Make sure WSL is using version 2
          wsl --set-default-version 2

          Write-Host ""
          Write-Host "Available distributions:"
          wsl --list --online

          Write-Host ""
          Write-Host "Installing Ubuntu 24.04..."

          wsl --install -d Ubuntu-24.04 --no-launch

          Write-Host ""
          Write-Host "Waiting for Ubuntu installation..."

          Start-Sleep -Seconds 15

          Write-Host ""
          Write-Host "WSL distributions:"
          wsl --list --verbose
      # ==========================================================
      # 3. Initialize Ubuntu
      # ==========================================================
      - name: 3. Initialize Ubuntu
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "
            set -e

            echo '=========================================='
            echo 'Ubuntu information'
            echo '=========================================='

            cat /etc/os-release

            echo ''
            echo 'Kernel:'
            uname -a
          "

      # ==========================================================
      # 4. Install Docker Engine inside WSL
      # ==========================================================
      - name: 4. Install Docker Engine
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "
            set -e

            echo '=========================================='
            echo 'Installing Docker Engine'
            echo '=========================================='

            export DEBIAN_FRONTEND=noninteractive

            sudo apt-get update

            sudo apt-get install -y \
              ca-certificates \
              curl \
              gnupg

            sudo install -m 0755 -d /etc/apt/keyrings

            sudo rm -f /etc/apt/keyrings/docker.gpg

            curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
              | sudo gpg --dearmor \
              -o /etc/apt/keyrings/docker.gpg

            sudo chmod a+r /etc/apt/keyrings/docker.gpg

            echo \
              'deb [arch='\"'\"'amd64'\"'\"' signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
              '\"'\"'$(. /etc/os-release && echo $VERSION_CODENAME)'\"'\"' stable' \
              | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

            sudo apt-get update

            sudo apt-get install -y \
              docker-ce \
              docker-ce-cli \
              containerd.io \
              docker-buildx-plugin \
              docker-compose-plugin

            sudo service docker start

            sudo docker version

            sudo docker compose version
          "

      # ==========================================================
      # 5. Verify Docker
      # ==========================================================
      - name: 5. Verify Docker
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "
            set -e

            sudo service docker start || true

            echo 'Docker:'
            sudo docker version

            echo ''
            echo 'Docker Compose:'
            sudo docker compose version

            echo ''
            echo 'Docker info:'
            sudo docker info
          "

      # ==========================================================
      # 6. Prepare persistent YouTrack directories
      # ==========================================================
      - name: 6. Prepare YouTrack storage
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "
            set -e

            echo '=========================================='
            echo 'Preparing YouTrack storage'
            echo '=========================================='

            sudo mkdir -p /opt/youtrack/data
            sudo mkdir -p /opt/youtrack/conf
            sudo mkdir -p /opt/youtrack/logs
            sudo mkdir -p /opt/youtrack/backups

            sudo chown -R 13001:13001 /opt/youtrack

            sudo chmod -R u+rwX /opt/youtrack

            echo ''
            echo 'Storage:'
            sudo ls -ld /opt/youtrack/*
          "

      # ==========================================================
      # 7. Pull official YouTrack image
      # ==========================================================
      - name: 7. Pull YouTrack
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "
            set -e

            sudo service docker start || true

            sudo docker pull jetbrains/youtrack:2026.2.18991
          "

      # ==========================================================
      # 8. Remove previous YouTrack container if exists
      # ==========================================================
      - name: 8. Clean previous YouTrack container
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "
            set -e

            sudo service docker start || true

            if sudo docker ps -a --format '{{.Names}}' \
              | grep -qx 'youtrack'
            then
              echo 'Removing existing YouTrack container...'

              sudo docker stop youtrack 2>/dev/null || true
              sudo docker rm youtrack 2>/dev/null || true
            else
              echo 'No previous YouTrack container found.'
            fi
          "

      # ==========================================================
      # 9. Start YouTrack
      # ==========================================================
      - name: 9. Start YouTrack
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "
            set -e

            sudo service docker start || true

            echo '=========================================='
            echo 'Starting YouTrack'
            echo '=========================================='

            sudo docker run -d \
              --name youtrack \
              --restart unless-stopped \
              -v /opt/youtrack/data:/opt/youtrack/data \
              -v /opt/youtrack/conf:/opt/youtrack/conf \
              -v /opt/youtrack/logs:/opt/youtrack/logs \
              -v /opt/youtrack/backups:/opt/youtrack/backups \
              -p 8080:8080 \
              jetbrains/youtrack:2026.2.18991

            echo ''
            echo 'Container:'

            sudo docker ps \
              --filter name=youtrack
          "

      # ==========================================================
      # 10. Force stable local Base URL
      # ==========================================================
      - name: 10. Configure YouTrack Base URL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "
            set -e

            echo 'Configuring Base URL...'

            sudo docker stop youtrack

            sudo docker run --rm \
              -v /opt/youtrack/conf:/opt/youtrack/conf \
              jetbrains/youtrack:2026.2.18991 \
              configure --base-url=http://localhost:8080

            sudo docker start youtrack

            echo 'Base URL configured:'
            echo 'http://localhost:8080'
          "

      # ==========================================================
      # 11. Wait for YouTrack
      # ==========================================================
      - name: 11. Wait for YouTrack
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc '
            set -e

            echo "Waiting for YouTrack..."

            for i in $(seq 1 60); do

              if curl -fsS \
                -o /dev/null \
                http://127.0.0.1:8080/hub/auth/login
              then
                echo ""
                echo "=========================================="
                echo "YouTrack is READY"
                echo "=========================================="
                exit 0
              fi

              echo "[$i/60] YouTrack is not ready yet..."

              sleep 5
            done

            echo ""
            echo "ERROR: YouTrack did not become ready."

            echo ""
            echo "Container status:"
            sudo docker ps -a --filter name=youtrack

            echo ""
            echo "Last logs:"
            sudo docker logs --tail 150 youtrack

            exit 1
          '

      # ==========================================================
      # 12. Verify HTTP
      # ==========================================================
      - name: 12. Verify YouTrack HTTP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "
            set -e

            echo 'HTTP test:'

            curl -I \
              http://127.0.0.1:8080/hub/auth/login

            echo ''
            echo 'Listening port:'

            sudo ss -lntp | grep ':8080'
          "

      # ==========================================================
      # 13. Final diagnostics
      # ==========================================================
      - name: 13. YouTrack Final Status
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          wsl.exe -d Ubuntu-24.04 -- bash -lc "
            echo ''
            echo '=========================================='
            echo '       YOURTRACK FINAL STATUS'
            echo '=========================================='

            echo ''
            echo 'Container:'
            sudo docker ps \
              --filter name=youtrack

            echo ''
            echo 'Base URL:'
            echo 'http://localhost:8080'

            echo ''
            echo 'HTTP:'

            curl -s \
              -o /dev/null \
              -w 'HTTP=%{http_code}\n' \
              http://127.0.0.1:8080/hub/auth/login

            echo ''
            echo 'Docker restart policy:'

            sudo docker inspect \
              --format='{{.HostConfig.RestartPolicy.Name}}' \
              youtrack

            echo ''
            echo 'YouTrack container uptime:'

            sudo docker inspect \
              --format='{{.State.Status}} | {{.State.StartedAt}}' \
              youtrack
          "

      # ==========================================================
      # 14. Keep Windows VPS alive
      # ==========================================================
      - name: 14. Keep Windows VPS Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Windows VPS + YouTrack is READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "YouTrack:"
          Write-Host "http://localhost:8080"
          Write-Host ""

          while ($true) {
              Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - VPS alive"
              Start-Sleep -Seconds 60
          }
