name: Windows Cloud RDP2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    name: Windows Cloud RDP
    steps:
    
      # ============================================================
      # 1. ENABLE RDP
      # ============================================================
      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          Write-Host "=== Enabling Remote Desktop ===" -ForegroundColor Cyan
    
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0
    
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    
          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1
    
          Write-Host "RDP enabled." -ForegroundColor Green
    
    
      # ============================================================
      # 2. CREATE ADMIN ACCOUNT
      # ============================================================
      - name: 2. Create Admin Account
        shell: powershell
        run: |
          Write-Host "=== Creating NvDAdmin ===" -ForegroundColor Cyan
    
          $Password = ConvertTo-SecureString `
            "P@ssw0rd1qazXSW@#" `
            -AsPlainText `
            -Force
    
          if (-not (Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue)) {
    
            New-LocalUser `
              -Name "NvDAdmin" `
              -Password $Password `
              -PasswordNeverExpires `
              -AccountNeverExpires
    
            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "NvDAdmin"
          }
    
          Write-Host "NvDAdmin ready." -ForegroundColor Green
    
    
      # ============================================================
      # 3. TAILSCALE
      # ============================================================
      - name: 3. Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "=== Installing Tailscale ===" -ForegroundColor Cyan
    
          $TailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
    
          if (-not (Test-Path $TailscalePath)) {
    
            Invoke-WebRequest `
              "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
              -OutFile "C:\tailscale.msi"
    
            Start-Process `
              msiexec.exe `
              -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
              -Wait
          }
    
          Start-Sleep -Seconds 5
    
          & $TailscalePath up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"
    
          Start-Sleep -Seconds 5
    
          $ts_ip = & $TailscalePath ip -4
    
          Write-Host ""
          Write-Host "============================================" -ForegroundColor Green
          Write-Host "RDP SERVER READY" -ForegroundColor Green
          Write-Host "============================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Cyan
          Write-Host "Username     : NvDAdmin" -ForegroundColor Cyan
          Write-Host "Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Cyan
          Write-Host "============================================" -ForegroundColor Green
          
      # ============================================================
      # 4. ENABLE WSL2
      # ============================================================
      - name: 4. Enable WSL2
        shell: powershell
        run: |
          Write-Host "=== Enabling WSL2 ===" -ForegroundColor Cyan
    
          dism.exe /online /enable-feature `
            /featurename:Microsoft-Windows-Subsystem-Linux `
            /all `
            /norestart
    
          dism.exe /online /enable-feature `
            /featurename:VirtualMachinePlatform `
            /all `
            /norestart
    
          wsl.exe --set-default-version 2
    
          Write-Host "WSL2 features enabled." -ForegroundColor Green
    
    
      # ============================================================
      # 5. INSTALL UBUNTU
      # ============================================================
      - name: 5. Install Ubuntu
        shell: powershell
        run: |
          Write-Host "=== Installing Ubuntu WSL2 ===" -ForegroundColor Cyan
    
          $existing = @(wsl.exe --list --quiet 2>$null)
    
          if ($existing -match "Ubuntu") {
    
            Write-Host "Ubuntu already exists." -ForegroundColor Green
    
          } else {
    
            Write-Host "Ubuntu not found. Installing from WSL..." -ForegroundColor Yellow
    
            wsl.exe --install --distribution Ubuntu --no-launch
    
            if ($LASTEXITCODE -ne 0) {
    
              Write-Warning "wsl --install returned exit code $LASTEXITCODE"
    
              Write-Host "Trying winget installation..." -ForegroundColor Yellow
    
              winget install `
                --id Canonical.Ubuntu `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity
    
              if ($LASTEXITCODE -ne 0) {
                throw "Ubuntu installation failed."
              }
            }
          }
    
          Write-Host "Ubuntu installation command completed." -ForegroundColor Green
    
    
      # ============================================================
      # 6. VERIFY UBUNTU
      # ============================================================
      - name: 6. Verify Ubuntu WSL2
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
      
          Write-Host "=== WSL status ==="
          wsl.exe --status
      
          Write-Host ""
          Write-Host "=== Installed distributions ==="
          wsl.exe --list --verbose
      
          Write-Host ""
          Write-Host "=== Testing Ubuntu directly ==="
      
          # Do NOT parse the output of `wsl --list`.
          # WSL on GitHub Windows runners may return Unicode output
          # that PowerShell does not match correctly.
      
          wsl.exe -d Ubuntu -- echo "Ubuntu WSL2 is working"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Ubuntu WSL distribution exists but could not be started."
          }
      
          Write-Host ""
          Write-Host "Ubuntu WSL2 is working correctly."
      
          Write-Host ""
          Write-Host "=== Setting Ubuntu as default ==="
      
          wsl.exe --set-default Ubuntu
      
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to set Ubuntu as the default WSL distribution."
          }
      
          Write-Host ""
          Write-Host "=== Final verification ==="
      
          wsl.exe -d Ubuntu -- bash -c "echo 'Linux kernel:'; uname -a; echo 'Ubuntu:'; cat /etc/os-release | head -n 2"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Ubuntu final verification failed."
          }
      
          Write-Host ""
          Write-Host "======================================"
          Write-Host " Ubuntu WSL2 READY"
          Write-Host "======================================"
      # ============================================================
      # 7. FORCE UBUNTU TO WSL2
      # ============================================================
      - name: 7. Set Ubuntu to WSL2
        shell: powershell
        run: |
          Write-Host "=== Setting Ubuntu to WSL2 ===" -ForegroundColor Cyan
    
          wsl.exe --set-version Ubuntu 2
    
          wsl.exe --set-default Ubuntu
    
          wsl.exe --list --verbose
    
          Write-Host "Ubuntu configured for WSL2." -ForegroundColor Green
    
    
      # ============================================================
      # 8. INITIALIZE UBUNTU
      # ============================================================
      - name: 8. Initialize Ubuntu
        shell: powershell
        run: |
          Write-Host "=== Initializing Ubuntu ===" -ForegroundColor Cyan
    
          # Check that Ubuntu can actually start
          wsl.exe -d Ubuntu -- echo "Ubuntu WSL2 is working"
    
          if ($LASTEXITCODE -ne 0) {
            throw "Ubuntu exists but could not be started."
          }
    
          Write-Host "Ubuntu is running correctly." -ForegroundColor Green
    
    
      # ============================================================
      # 9. INSTALL GIT
      # ============================================================
      - name: 9. Install Git
        shell: powershell
        run: |
          Write-Host "=== Checking Git ===" -ForegroundColor Cyan
    
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
    
          if ($git) {
    
            git --version
            Write-Host "Git already installed." -ForegroundColor Yellow
    
          } else {
    
            winget install `
              --id Git.Git `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity `
              --source winget
    
            if ($LASTEXITCODE -ne 0) {
              throw "Git installation failed. Exit code: $LASTEXITCODE"
            }
    
            $env:Path = `
              [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
              [System.Environment]::GetEnvironmentVariable("Path", "User")
    
            git --version
          }
    
          Write-Host "Git READY." -ForegroundColor Green
    
    
      # ============================================================
      # 10. INSTALL PYTHON
      # ============================================================
      - name: 10. Install Python
        shell: powershell
        run: |
          Write-Host "=== Checking Python ===" -ForegroundColor Cyan
    
          if (Get-Command python.exe -ErrorAction SilentlyContinue) {
    
            python --version
    
          } else {
    
            winget install `
              --id Python.Python.3.12 `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity
    
            if ($LASTEXITCODE -ne 0) {
              throw "Python installation failed."
            }
          }
    
          Write-Host "Python READY." -ForegroundColor Green
    
    
      # ============================================================
      # 11. INSTALL NODE.JS
      # ============================================================
      - name: 11. Install Node.js
        shell: powershell
        run: |
          Write-Host "=== Checking Node.js ===" -ForegroundColor Cyan
    
          if (Get-Command node.exe -ErrorAction SilentlyContinue) {
    
            node --version
    
          } else {
    
            winget install `
              --id OpenJS.NodeJS.LTS `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity
    
            if ($LASTEXITCODE -ne 0) {
              throw "Node.js installation failed."
            }
          }
    
          Write-Host "Node.js READY." -ForegroundColor Green
    
    
      # ============================================================
      # 12. INSTALL DOCKER ENGINE IN UBUNTU
      # ============================================================
      - name: 12. Install Docker Engine inside Ubuntu
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
      
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host " INSTALL DOCKER ENGINE IN UBUNTU" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
      
          # 1. Check Ubuntu
          wsl.exe -d Ubuntu -- bash -c "echo 'Ubuntu is working'"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Ubuntu cannot be started."
          }
      
          # 2. Update Ubuntu
          wsl.exe -d Ubuntu -- bash -c "sudo apt-get update"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Ubuntu apt update failed."
          }
      
          # 3. Install prerequisites
          wsl.exe -d Ubuntu -- bash -c "sudo apt-get install -y ca-certificates curl gnupg"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker prerequisites installation failed."
          }
      
          # 4. Create Docker keyring
          wsl.exe -d Ubuntu -- bash -c "sudo install -m 0755 -d /etc/apt/keyrings"
      
          # 5. Download Docker GPG key
          wsl.exe -d Ubuntu -- bash -c "sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker GPG key download failed."
          }
      
          # 6. Set key permissions
          wsl.exe -d Ubuntu -- bash -c "sudo chmod a+r /etc/apt/keyrings/docker.asc"
      
          # 7. Get Ubuntu architecture and codename separately
          $UbuntuArch = (wsl.exe -d Ubuntu -- bash -c "dpkg --print-architecture").Trim()
      
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($UbuntuArch)) {
              throw "Could not determine Ubuntu architecture."
          }
      
          $UbuntuCodename = (wsl.exe -d Ubuntu -- bash -c ". /etc/os-release && echo `$VERSION_CODENAME").Trim()
      
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($UbuntuCodename)) {
              throw "Could not determine Ubuntu release codename."
          }
      
          Write-Host "Ubuntu architecture: $UbuntuArch"
          Write-Host "Ubuntu codename: $UbuntuCodename"
      
          # 8. Configure Docker repository
          $DockerRepo = "deb [arch=$UbuntuArch signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $UbuntuCodename stable"
      
          Write-Host "Docker repository:"
          Write-Host $DockerRepo
      
          wsl.exe -d Ubuntu -- bash -c "echo '$DockerRepo' | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker repository configuration failed."
          }
      
          # 9. Update package lists
          wsl.exe -d Ubuntu -- bash -c "sudo apt-get update"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker repository apt update failed."
          }
      
          # 10. Install Docker Engine
          wsl.exe -d Ubuntu -- bash -c "sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker Engine installation failed."
          }
      
          # 11. Start Docker daemon
          wsl.exe -d Ubuntu -- bash -c "sudo service docker start"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker service failed to start."
          }
      
          # 12. Verify Docker CLI
          wsl.exe -d Ubuntu -- bash -c "sudo docker --version"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker CLI verification failed."
          }
      
          # 13. Verify Docker Compose
          wsl.exe -d Ubuntu -- bash -c "sudo docker compose version"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker Compose verification failed."
          }
      
          # 14. Run Docker test container
          wsl.exe -d Ubuntu -- bash -c "sudo docker run --rm hello-world"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker hello-world test failed."
          }
      
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " Docker Engine + Compose READY" -ForegroundColor Green
          Write-Host " Docker Desktop NOT installed" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green
      # ============================================================
      # 13. VERIFY DOCKER
      # ============================================================
      - name: 13. Final Docker Verification
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
      
          Write-Host "=== Final Docker Verification ===" -ForegroundColor Cyan
      
          wsl.exe -d Ubuntu -- bash -c "sudo service docker status --no-pager"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker service is not running."
          }
      
          wsl.exe -d Ubuntu -- bash -c "sudo docker --version"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker CLI is not available."
          }
      
          wsl.exe -d Ubuntu -- bash -c "sudo docker compose version"
      
          if ($LASTEXITCODE -ne 0) {
              throw "Docker Compose is not available."
          }
      
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " Docker is fully operational" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green


       
      # ============================================================
      # 14. CREATE PROJECT DIRECTORIES
      # ============================================================
      - name: 14. Create Linux Project Directories
        shell: powershell
        run: |
          Write-Host "=== Creating Linux directories ===" -ForegroundColor Cyan
    
          wsl.exe -d Ubuntu -- bash -c @"
          mkdir -p ~/projects
          mkdir -p ~/projects/odoo
          mkdir -p ~/projects/youtrack
          mkdir -p ~/projects/python
          mkdir -p ~/projects/node
          mkdir -p ~/backup
    
          echo "Linux project directories:"
          ls -la ~/projects
          "@
    
          Write-Host "Directories ready." -ForegroundColor Green
    
    
      # ============================================================
      # 15. FINAL VERIFICATION
      # ============================================================
      - name: 15. Final Environment Check
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "              FINAL ENVIRONMENT CHECK" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan
    
          Write-Host ""
          Write-Host "--- Windows Git ---" -ForegroundColor Yellow
          git --version
    
          Write-Host ""
          Write-Host "--- Windows Python ---" -ForegroundColor Yellow
          python --version
    
          Write-Host ""
          Write-Host "--- Windows Node ---" -ForegroundColor Yellow
          node --version
    
          Write-Host ""
          Write-Host "--- WSL ---" -ForegroundColor Yellow
          wsl.exe --list --verbose
    
          Write-Host ""
          Write-Host "--- Ubuntu Docker ---" -ForegroundColor Yellow
          wsl.exe -d Ubuntu -- bash -c "docker --version"
    
          Write-Host ""
          Write-Host "--- Docker Compose ---" -ForegroundColor Yellow
          wsl.exe -d Ubuntu -- bash -c "docker compose version"
    
          Write-Host ""
          Write-Host "--- Tailscale ---" -ForegroundColor Yellow
          & "C:\Program Files\Tailscale\tailscale.exe" version
    
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "           VPS INITIALIZATION COMPLETE" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
    
    
      # ============================================================
      # 16. CONNECTION INFORMATION
      # ============================================================
      - name: 16. Display Connection Information
        shell: powershell
        run: |
          $TailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
          $ts_ip = & $TailscalePath ip -4
    
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "                WINDOWS VPS READY" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "RDP Address : $ts_ip" -ForegroundColor Cyan
          Write-Host "Username    : NvDAdmin" -ForegroundColor Cyan
          Write-Host "Password    : P@ssw0rd1qazXSW@#" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "Windows:"
          Write-Host "  [OK] RDP"
          Write-Host "  [OK] Tailscale"
          Write-Host "  [OK] Git"
          Write-Host "  [OK] Python"
          Write-Host "  [OK] Node.js"
          Write-Host "  [OK] VS Code"
          Write-Host "  [OK] Persian Keyboard"
          Write-Host ""
          Write-Host "Linux / WSL2:"
          Write-Host "  [OK] Ubuntu"
          Write-Host "  [OK] Docker Engine"
          Write-Host "  [OK] Docker Compose"
          Write-Host ""
          Write-Host "YouTrack can now be installed inside Docker."
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
    
    
      # ============================================================
      # 17. KEEP SERVER ALIVE
      # ============================================================
      - name: 17. Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 2880; $i++) {
    
            Start-Sleep -Seconds 60
    
            if (($i % 5) -eq 0) {
    
              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
    
              Write-Host "[$time] Server running... $i/2880 minutes"
            }
          }
